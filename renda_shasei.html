<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>連打射精シミュレーター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #080508;
    color: #eee;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    overflow: hidden;
    height: 100%;
    height: 100dvh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .score-box {
    background: rgba(0,0,0,0.78);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.5;
    border: 1px solid rgba(255,107,157,0.35);
  }
  .timer {
    font-size: 42px;
    font-weight: bold;
    color: #ff6b9d;
    text-shadow: 0 0 22px #ff6b9d;
    line-height: 1;
  }
  .mash-btn {
    position: absolute;
    left: 50%;
    bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(280px, 78vw);
    height: 64px;
    border-radius: 40px;
    background: linear-gradient(180deg, #ff7aa8, #c44569);
    border: none;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    pointer-events: auto;
    box-shadow: 0 6px 24px rgba(255,80,140,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    display: none;
    touch-action: manipulation;
  }
  .mash-btn:active {
    transform: translateX(-50%) scale(0.96);
    background: linear-gradient(180deg, #e65a90, #a33858);
  }
  .result-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(16,6,12,0.95);
    border: 2px solid #ff6b9d;
    border-radius: 20px;
    padding: 24px 28px;
    text-align: center;
    width: min(340px, 90vw);
    pointer-events: auto;
    box-shadow: 0 0 50px rgba(255,70,130,0.3);
  }
  .result-panel h2 {
    font-size: 24px;
    color: #ff6b9d;
    margin-bottom: 14px;
  }
  .result-row {
    font-size: 17px;
    margin: 8px 0;
  }
  .result-value {
    color: #ffcc00;
    font-weight: bold;
    font-size: 22px;
  }
  .rank {
    margin-top: 14px;
    font-size: 18px;
    color: #ff99cc;
    line-height: 1.4;
  }
  .result-panel button {
    margin-top: 18px;
    padding: 12px 30px;
    font-size: 18px;
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,107,157,0.4);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top-bar">
    <div class="score-box" id="infoBox" style="display:none">
      <div>連打: <span id="tapCount">0</span></div>
      <div>勢い: <span id="power">0</span>%</div>
    </div>
    <div class="timer" id="timer" style="display:none">6.0</div>
  </div>
</div>
<button class="mash-btn" id="mashBtn">連打！</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const mashBtn = document.getElementById('mashBtn');
let W, H, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ========== State ==========
const STATE = { TITLE: 0, COUNTDOWN: 1, MASHING: 2, CLIMAX: 3, RESULT: 4 };
let state = STATE.TITLE;
let taps = 0;
let timeLeft = 6.0;
let lastTime = 0;
let countdown = 3;
let climaxTimer = 0;
let particles = [];
let maxDist = 0;
let volume = 0;
let rankText = "";
let rankColor = "#ff99cc";
let spurtsLeft = 0;
let nextSpurtTime = 0;
let bodyX, bodyY, penisAngle, penisLen, throb = 0;

// ========== Liquid particle (soft continuous look) ==========
class FluidParticle {
  constructor(x, y, vx, vy, size, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.size = size;
    this.baseSize = size;
    this.life = life;
    this.maxLife = life;
    this.alpha = 1;
    this.stuck = false;
    this.r = 248 + Math.random() * 7;
    this.g = 240 + Math.random() * 10;
    this.b = 210 + Math.random() * 25;
    this.prevX = x;
    this.prevY = y;
  }

  update(dt) {
    this.prevX = this.x;
    this.prevY = this.y;

    if (this.stuck) {
      this.life -= dt * 0.18;
      this.alpha = Math.max(0, this.life / this.maxLife);
      this.size = this.baseSize * (0.75 + this.alpha * 0.25);
      return;
    }

    this.vy += 880 * dt;
    const drag = 0.991;
    this.vx *= drag;
    this.vy *= drag;
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    const floorY = H - 36;
    if (this.y + this.size * 0.6 > floorY) {
      this.y = floorY - this.size * 0.55;
      const impact = Math.abs(this.vy);
      this.vy *= -0.12 - Math.random() * 0.1;
      this.vx *= 0.5 + Math.random() * 0.25;

      if (impact > 70 && Math.random() < 0.45) {
        for (let s = 0; s < 1 + (Math.random() * 2 | 0); s++) {
          const ang = -1.4 + Math.random() * 1.0;
          const spd = 30 + Math.random() * impact * 0.2;
          particles.push(new FluidParticle(
            this.x + (Math.random() - 0.5) * 6,
            this.y,
            Math.cos(ang) * spd,
            Math.sin(ang) * spd * 0.7,
            2 + Math.random() * 3,
            1.4 + Math.random()
          ));
        }
      }

      if (Math.abs(this.vy) < 50 && Math.abs(this.vx) < 80) {
        this.stuck = true;
        this.vy = 0;
        this.vx *= 0.25;
      }
    }

    if (this.x < 4) { this.x = 4; this.vx *= -0.3; }
    if (this.x > W - 4) { this.x = W - 4; this.vx *= -0.3; }

    this.life -= dt * 0.09;
    this.alpha = Math.max(0, this.life / this.maxLife);
  }

  draw(ctx) {
    if (this.alpha < 0.03) return;
    const a = this.alpha;

    // motion ribbon for continuous liquid feel
    const dx = this.x - this.prevX;
    const dy = this.y - this.prevY;
    const dist = Math.hypot(dx, dy);
    if (dist > 1.5 && !this.stuck) {
      const steps = Math.min(6, Math.ceil(dist / 3));
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        const px = this.prevX + dx * t;
        const py = this.prevY + dy * t;
        const s = this.size * (0.7 + t * 0.3);
        ctx.beginPath();
        ctx.arc(px, py, s * 1.1, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.r|0},${this.g|0},${this.b|0},${a * 0.22})`;
        ctx.fill();
      }
    }

    // soft outer
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2.1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.r|0},${this.g|0},${this.b|0},${a * 0.16})`;
    ctx.fill();

    // mid
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 1.35, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.r|0},${this.g|0},${this.b|0},${a * 0.45})`;
    ctx.fill();

    // core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.r|0},${this.g|0},${this.b|0},${a * 0.88})`;
    ctx.fill();
  }
}

function spawnSpurt(force, intensity) {
  const tipX = bodyX + Math.cos(penisAngle) * (penisLen + 6);
  const tipY = bodyY + Math.sin(penisAngle) * (penisLen + 6);
  const baseSpeed = 340 + force * 12.5;
  const count = Math.floor(28 + intensity * 32 + force * 0.9);

  for (let i = 0; i < count; i++) {
    const spread = (Math.random() - 0.5) * (0.38 + force * 0.004);
    const speed = baseSpeed * (0.6 + Math.random() * 0.55) * (0.8 + intensity * 0.3);
    const angle = penisAngle + spread;
    const vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 55;
    const vy = Math.sin(angle) * speed + (Math.random() - 0.5) * 40 - 25;
    const size = 4.5 + Math.random() * 7.5 + (force > 65 ? Math.random() * 3 : 0);
    const life = 6 + Math.random() * 5;
    particles.push(new FluidParticle(tipX, tipY, vx, vy, size, life));
  }
}

// ========== Realistic penis drawing ==========
function drawRealisticPenis() {
  ctx.save();
  ctx.translate(bodyX, bodyY);

  const skin = '#e0a890';
  const skinDark = '#c48a72';
  const skinLight = '#f0c4b0';

  // thigh
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(-28, 55, 62, 78, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,70,50,0.25)';
  ctx.beginPath();
  ctx.ellipse(-10, 70, 30, 40, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // lower torso
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(-48, -20, 46, 62, -0.25, 0, Math.PI * 2);
  ctx.fill();

  // balls
  ctx.save();
  const ballGrad1 = ctx.createRadialGradient(-14, 38, 2, -12, 36, 20);
  ballGrad1.addColorStop(0, '#e8b8a0');
  ballGrad1.addColorStop(0.7, '#d4a08a');
  ballGrad1.addColorStop(1, '#b88070');
  ctx.fillStyle = ballGrad1;
  ctx.beginPath();
  ctx.ellipse(-12, 38, 19, 17, 0.3, 0, Math.PI * 2);
  ctx.fill();

  const ballGrad2 = ctx.createRadialGradient(14, 40, 2, 12, 38, 18);
  ballGrad2.addColorStop(0, '#e8b8a0');
  ballGrad2.addColorStop(0.7, '#d0a088');
  ballGrad2.addColorStop(1, '#b07868');
  ctx.fillStyle = ballGrad2;
  ctx.beginPath();
  ctx.ellipse(14, 40, 17, 16, -0.25, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(100,60,50,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 28);
  ctx.quadraticCurveTo(2, 42, 0, 52);
  ctx.stroke();
  ctx.restore();

  // shaft
  const pulse = 1 + Math.sin(throb) * 0.045;
  ctx.save();
  ctx.rotate(penisAngle);

  const len = penisLen * pulse;
  const thick = 16 * pulse;

  const shaftGrad = ctx.createLinearGradient(0, -thick, 0, thick);
  shaftGrad.addColorStop(0, skinLight);
  shaftGrad.addColorStop(0.35, skin);
  shaftGrad.addColorStop(0.7, skinDark);
  shaftGrad.addColorStop(1, '#b07060');

  ctx.beginPath();
  ctx.moveTo(8, -thick * 0.85);
  ctx.quadraticCurveTo(len * 0.35, -thick * 1.05, len * 0.75, -thick * 0.9);
  ctx.quadraticCurveTo(len * 0.92, -thick * 0.7, len * 0.95, 0);
  ctx.quadraticCurveTo(len * 0.92, thick * 0.7, len * 0.75, thick * 0.9);
  ctx.quadraticCurveTo(len * 0.35, thick * 1.05, 8, thick * 0.85);
  ctx.closePath();
  ctx.fillStyle = shaftGrad;
  ctx.fill();

  // underside shadow
  ctx.fillStyle = 'rgba(90,50,40,0.28)';
  ctx.beginPath();
  ctx.moveTo(10, thick * 0.3);
  ctx.quadraticCurveTo(len * 0.4, thick * 0.85, len * 0.85, thick * 0.55);
  ctx.quadraticCurveTo(len * 0.5, thick * 0.4, 10, thick * 0.15);
  ctx.fill();

  // top highlight
  ctx.strokeStyle = 'rgba(255,230,210,0.45)';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(14, -thick * 0.55);
  ctx.quadraticCurveTo(len * 0.4, -thick * 0.75, len * 0.78, -thick * 0.5);
  ctx.stroke();

  // veins
  ctx.strokeStyle = 'rgba(160,80,90,0.28)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(len * 0.18, -thick * 0.15);
  ctx.quadraticCurveTo(len * 0.4, -thick * 0.35, len * 0.62, -thick * 0.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(len * 0.25, thick * 0.2);
  ctx.quadraticCurveTo(len * 0.5, thick * 0.4, len * 0.7, thick * 0.15);
  ctx.stroke();

  // glans
  const glansX = len * 0.98;
  const glansR = 15 * pulse;

  const glansGrad = ctx.createRadialGradient(glansX - 4, -3, 2, glansX, 0, glansR * 1.3);
  glansGrad.addColorStop(0, '#f2c4b0');
  glansGrad.addColorStop(0.45, '#e0a090');
  glansGrad.addColorStop(0.8, '#c87870');
  glansGrad.addColorStop(1, '#a85858');

  ctx.beginPath();
  ctx.ellipse(glansX, 0, glansR * 1.15, glansR * 0.95, 0, 0, Math.PI * 2);
  ctx.fillStyle = glansGrad;
  ctx.fill();

  // corona
  ctx.strokeStyle = 'rgba(140,70,70,0.45)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(glansX - 5, 0, glansR * 0.55, glansR * 0.9, 0, -Math.PI * 0.55, Math.PI * 0.55);
  ctx.stroke();

  // highlight
  ctx.fillStyle = 'rgba(255,230,220,0.4)';
  ctx.beginPath();
  ctx.ellipse(glansX - 2, -5, 6, 4.5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // meatus
  ctx.fillStyle = 'rgba(90,45,50,0.55)';
  ctx.beginPath();
  ctx.ellipse(glansX + glansR * 0.55, 0, 3.2, 1.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,30,35,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(glansX + glansR * 0.35, -2.5);
  ctx.lineTo(glansX + glansR * 0.7, 0);
  ctx.lineTo(glansX + glansR * 0.35, 2.5);
  ctx.stroke();

  // frenulum
  ctx.strokeStyle = 'rgba(160,90,90,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(glansX - 8, 4);
  ctx.quadraticCurveTo(glansX - 2, 8, glansX + 4, 5);
  ctx.stroke();

  ctx.restore();
  ctx.restore();
}

function drawFloor() {
  const grad = ctx.createLinearGradient(0, H - 100, 0, H);
  grad.addColorStop(0, 'rgba(20,12,16,0)');
  grad.addColorStop(0.4, 'rgba(30,20,25,0.5)');
  grad.addColorStop(1, 'rgba(12,8,10,1)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H - 100, W, 100);

  ctx.strokeStyle = 'rgba(255,140,170,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 36);
  ctx.lineTo(W, H - 36);
  ctx.stroke();
}

function drawBackground() {
  const g = ctx.createRadialGradient(W * 0.45, H * 0.25, 0, W * 0.5, H * 0.5, W * 0.9);
  g.addColorStop(0, '#1a1016');
  g.addColorStop(1, '#070406');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawMergedPuddles() {
  const stuck = particles.filter(p => p.stuck && p.alpha > 0.05);
  if (stuck.length === 0) return;

  for (const p of stuck) {
    const a = p.alpha * 0.55;
    ctx.beginPath();
    ctx.ellipse(p.x, H - 36, p.size * 2.4, p.size * 0.7, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r|0},${p.g|0},${p.b|0},${a})`;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(p.x, H - 36, p.size * 3.2, p.size * 1.0, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r|0},${p.g|0},${p.b|0},${a * 0.25})`;
    ctx.fill();
  }
}

function showElement(id, show) {
  const el = document.getElementById(id);
  if (el) el.style.display = show ? '' : 'none';
}

function updateUI() {
  document.getElementById('tapCount').textContent = taps;
  const power = Math.min(100, Math.floor(taps * 1.7));
  document.getElementById('power').textContent = power;
  document.getElementById('timer').textContent = timeLeft.toFixed(1);
}

function getRank(t) {
  if (t >= 140) return { text: "神の射精…床も壁も真っ白", color: "#ffcc00" };
  if (t >= 105) return { text: "大量噴出！とんでもない勢い", color: "#ff66aa" };
  if (t >= 80)  return { text: "かなり出た…床びしょびしょ", color: "#ff88bb" };
  if (t >= 55)  return { text: "ちゃんと出た。満足感あり", color: "#ff99cc" };
  if (t >= 32)  return { text: "そこそこ出た", color: "#cc99aa" };
  if (t >= 15)  return { text: "ちょっと出た程度", color: "#aa8899" };
  return { text: "ほぼ空撃ち…もっと連打しろ", color: "#888" };
}

function doTap() {
  if (state === STATE.TITLE) {
    startCountdown();
    return;
  }
  if (state === STATE.MASHING) {
    taps++;
    throb += 1.2;
    penisAngle = -0.55 + (Math.random() - 0.5) * 0.09;
  }
}

function bindTap(el) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    doTap();
  }, { passive: false });
}
bindTap(canvas);
bindTap(mashBtn);

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    doTap();
  }
});

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

function startCountdown() {
  state = STATE.COUNTDOWN;
  countdown = 3;
  taps = 0;
  timeLeft = 6.0;
  particles = [];
  maxDist = 0;
  volume = 0;
  spurtsLeft = 0;
  showElement('infoBox', false);
  showElement('timer', false);
  mashBtn.style.display = 'none';
  const panel = document.getElementById('resultPanel');
  if (panel) panel.style.display = 'none';
}

function startMashing() {
  state = STATE.MASHING;
  showElement('infoBox', true);
  showElement('timer', true);
  mashBtn.style.display = 'block';
  updateUI();
}

function startClimax() {
  state = STATE.CLIMAX;
  climaxTimer = 0;
  showElement('infoBox', false);
  showElement('timer', false);
  mashBtn.style.display = 'none';

  const force = Math.min(100, taps * 1.7);
  spurtsLeft = 3 + Math.floor(force / 25);
  nextSpurtTime = 0;

  spawnSpurt(force, 1.15);
  spurtsLeft--;
  volume = particles.length;

  penisAngle = -0.85;
  throb = 14;
}

function showResult() {
  state = STATE.RESULT;
  maxDist = 0;
  for (const p of particles) {
    const d = Math.hypot(p.x - bodyX, p.y - bodyY);
    if (d > maxDist) maxDist = d;
  }
  maxDist = Math.floor(maxDist);
  volume = Math.max(volume, particles.length);
  const r = getRank(taps);
  rankText = r.text;
  rankColor = r.color;
}

function loop(timestamp) {
  const dt = Math.min(0.033, (timestamp - lastTime) / 1000 || 0.016);
  lastTime = timestamp;

  bodyX = W * 0.26;
  bodyY = H * 0.58;
  penisLen = Math.min(105, Math.max(70, W * 0.13));

  if (state !== STATE.CLIMAX && state !== STATE.RESULT) {
    penisAngle = -0.48 + Math.sin(throb) * 0.04;
  }
  throb += dt * 3.4;

  if (state === STATE.COUNTDOWN) {
    countdown -= dt;
    if (countdown <= 0) startMashing();
  } else if (state === STATE.MASHING) {
    timeLeft -= dt;
    updateUI();
    if (timeLeft <= 0) startClimax();
  } else if (state === STATE.CLIMAX) {
    climaxTimer += dt;

    if (spurtsLeft > 0 && climaxTimer > nextSpurtTime) {
      const force = Math.min(100, taps * 1.7);
      spawnSpurt(force * (0.65 + Math.random() * 0.35), 0.55 + spurtsLeft * 0.15);
      volume = Math.max(volume, particles.length);
      spurtsLeft--;
      nextSpurtTime = climaxTimer + 0.16 + Math.random() * 0.2;
      penisAngle = -0.8 - Math.random() * 0.12;
      throb += 2.5;
    }

    for (const p of particles) p.update(dt);
    particles = particles.filter(p => p.alpha > 0.02);

    if (climaxTimer > 5.0) showResult();
  } else if (state === STATE.RESULT) {
    for (const p of particles) p.update(dt);
    particles = particles.filter(p => p.alpha > 0.02);
  }

  drawBackground();
  drawFloor();
  drawMergedPuddles();

  if (state === STATE.CLIMAX || state === STATE.RESULT) {
    particles.sort((a, b) => a.y - b.y);
    for (const p of particles) p.draw(ctx);
  }

  drawRealisticPenis();

  ctx.save();
  if (state === STATE.TITLE) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b9d';
    ctx.font = 'bold 42px sans-serif';
    ctx.fillText('連打射精シミュレーター', W / 2, H * 0.28);
    ctx.fillStyle = '#eee';
    ctx.font = '18px sans-serif';
    ctx.fillText('制限時間内に連打せよ', W / 2, H * 0.38);
    ctx.fillText('回数で射精量と飛距離が決まる', W / 2, H * 0.44);
    ctx.fillStyle = '#ff99cc';
    ctx.font = '17px sans-serif';
    ctx.fillText('画面タップ or 下のボタンでスタート', W / 2, H * 0.58);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '14px sans-serif';
    ctx.fillText('スマホ対応・液体強化・リアルちんこ版', W / 2, H * 0.68);
  } else if (state === STATE.COUNTDOWN) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b9d';
    ctx.font = 'bold 100px sans-serif';
    const n = Math.ceil(countdown);
    ctx.fillText(n > 0 ? n : 'GO!', W / 2, H * 0.48);
  } else if (state === STATE.MASHING) {
    if (taps > 0 && taps % 6 === 0) {
      ctx.fillStyle = 'rgba(255,110,160,0.06)';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '20px sans-serif';
    ctx.fillText('連打しろ！', W / 2, H * 0.14);
  } else if (state === STATE.CLIMAX && climaxTimer < 0.5) {
    ctx.fillStyle = `rgba(255,210,230,${0.2 - climaxTimer * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  let panel = document.getElementById('resultPanel');
  if (state === STATE.RESULT) {
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'resultPanel';
      panel.className = 'result-panel';
      document.body.appendChild(panel);
    }
    panel.style.display = 'block';
    panel.innerHTML = `
      <h2>射精結果</h2>
      <div class="result-row">連打回数　<span class="result-value">${taps}</span> 回</div>
      <div class="result-row">射精量　<span class="result-value">${volume}</span></div>
      <div class="result-row">最大飛距離　<span class="result-value">${maxDist}</span> px</div>
      <div class="rank" style="color:${rankColor}">${rankText}</div>
      <button onclick="restart()">もう一回やる</button>
    `;
  } else if (panel) {
    panel.style.display = 'none';
  }

  requestAnimationFrame(loop);
}

function restart() {
  const panel = document.getElementById('resultPanel');
  if (panel) panel.style.display = 'none';
  state = STATE.TITLE;
  particles = [];
  taps = 0;
  volume = 0;
  maxDist = 0;
  mashBtn.style.display = 'none';
}

requestAnimationFrame(loop);
</script>
</body>
</html>
